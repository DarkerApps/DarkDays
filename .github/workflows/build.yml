name: Build Dark Days APK

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_ID: com.priyamrai.darkdays
  KS_PASS: darkdays-keystore-2026
  KS_ALIAS: android

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2

      - name: Unpack Lovable zip
        run: |
          set -e
          ZIP="$(ls -1 *.zip 2>/dev/null | head -n1 || true)"
          if [ -z "$ZIP" ]; then echo "No .zip found in repo root"; exit 1; fi
          echo "Using zip: $ZIP"
          mkdir -p "$RUNNER_TEMP/src"
          unzip -q -o "$ZIP" -d "$RUNNER_TEMP/src"
          PKG="$(find "$RUNNER_TEMP/src" -maxdepth 3 -name package.json -not -path '*/node_modules/*' | head -n1)"
          if [ -z "$PKG" ]; then echo "package.json not found in zip"; exit 1; fi
          echo "WEB_ROOT=$(dirname "$PKG")" >> "$GITHUB_ENV"

      - name: Install and build web app
        run: |
          set -e
          cd "$WEB_ROOT"
          bun install --frozen-lockfile || bun install
          bun run build
          echo "---- output folders ----"
          ls -la . .output .output/public .output/server dist dist/client dist/server 2>/dev/null || true

      - name: Locate (or render) static index.html
        run: |
          set -e
          cd "$WEB_ROOT"
          WEB_OUT=""
          if [ -f .output/public/index.html ]; then WEB_OUT=".output/public"; fi
          if [ -z "$WEB_OUT" ] && [ -f dist/client/index.html ]; then WEB_OUT="dist/client"; fi

          if [ -z "$WEB_OUT" ]; then
            echo "No static index.html found. Trying to render it from the server build."
            for d in .output/public dist/client; do
              if [ -d "$d" ]; then WEB_OUT="$d"; break; fi
            done
            if [ -z "$WEB_OUT" ]; then echo "No client output folder found"; find . -maxdepth 3 -not -path './node_modules*' | head -80; exit 1; fi
            ENTRY=""
            for e in .output/server/index.mjs dist/server/index.js dist/server/server.js; do
              if [ -f "$e" ]; then ENTRY="$e"; break; fi
            done
            if [ -z "$ENTRY" ]; then echo "No server entry found"; find . -maxdepth 3 -not -path './node_modules*' | head -80; exit 1; fi
            cat > "$RUNNER_TEMP/render.mjs" <<'EOF'
          import { pathToFileURL } from "node:url";
          import fs from "node:fs";
          import path from "node:path";
          const [entry, outDir] = process.argv.slice(2);
          const mod = await import(pathToFileURL(path.resolve(entry)).href);
          const worker = mod.default ?? mod;
          const ctx = { waitUntil() {}, passThroughOnException() {} };
          const res = await worker.fetch(new Request("http://localhost/"), {}, ctx);
          const html = await res.text();
          if (!res.ok || !html.includes("<html")) {
            throw new Error("Render failed: status " + res.status + " " + html.slice(0, 300));
          }
          fs.writeFileSync(path.join(outDir, "index.html"), html);
          console.log("Rendered index.html, bytes:", html.length);
          EOF
            node "$RUNNER_TEMP/render.mjs" "$ENTRY" "$WEB_OUT"
          fi

          grep -q "Dark Days" "$WEB_OUT/index.html" || { echo "index.html looks wrong"; head -c 600 "$WEB_OUT/index.html"; exit 1; }
          echo "Web output: $WEB_OUT"
          echo "WEB_OUT=$WEB_ROOT/$WEB_OUT" >> "$GITHUB_ENV"

      - name: Create Android project
        run: |
          set -e
          A=android
          P=$A/app/src/main
          J=$P/java/com/priyamrai/darkdays
          mkdir -p $J $P/assets/www $P/res/values $P/res/drawable $P/res/mipmap-anydpi-v26 $P/res/mipmap-xxxhdpi

          # web files (service worker is not needed inside the app)
          cp -r "$WEB_OUT"/. $P/assets/www/
          rm -f $P/assets/www/sw.js $P/assets/www/workbox-*.js $P/assets/www/_headers $P/assets/www/_redirects
          test -f $P/assets/www/index.html

          # icons
          cp "$WEB_ROOT/public/icon-512.png" $P/res/mipmap-xxxhdpi/ic_launcher.png
          cp "$WEB_ROOT/public/icon-maskable-512.png" $P/res/drawable/ic_launcher_foreground.png

          cat > $A/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "DarkDays"
          include ":app"
          EOF

          cat > $A/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > $A/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > $A/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          def runNumber = Integer.parseInt(System.getenv('RUN_NUMBER') ?: '1')

          android {
              namespace 'com.priyamrai.darkdays'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.priyamrai.darkdays'
                  minSdk 24
                  targetSdk 35
                  versionCode runNumber
                  versionName "1.0.${runNumber}"
              }

              signingConfigs {
                  release {
                      storeFile file(System.getenv('KS_FILE'))
                      storePassword System.getenv('KS_PASS')
                      keyAlias System.getenv('KS_ALIAS')
                      keyPassword System.getenv('KS_PASS')
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.12.1'
          }
          EOF

          cat > $P/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Dark Days"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:allowBackup="false"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="false"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboardHidden|keyboard|uiMode|density">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > $P/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#000000</color>
              <color name="app_black">#000000</color>
              <style name="AppTheme" parent="@android:style/Theme.DeviceDefault.NoActionBar">
                  <item name="android:windowBackground">@color/app_black</item>
                  <item name="android:statusBarColor">@color/app_black</item>
                  <item name="android:navigationBarColor">@color/app_black</item>
              </style>
          </resources>
          EOF

          cat > $P/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground>
                  <inset android:drawable="@drawable/ic_launcher_foreground" android:inset="9%" />
              </foreground>
          </adaptive-icon>
          EOF

          cat > $J/MainActivity.java <<'EOF'
          package com.priyamrai.darkdays;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.util.Base64;
          import android.view.ViewGroup;
          import android.webkit.JavascriptInterface;
          import android.webkit.JsResult;
          import android.webkit.MimeTypeMap;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.Toast;

          import androidx.webkit.WebViewAssetLoader;

          import java.io.ByteArrayInputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.util.Locale;

          public class MainActivity extends Activity {
              private static final String HOST = "appassets.androidplatform.net";
              private static final String START_URL = "https://" + HOST + "/";
              private static final int REQ_FILE = 1;
              private static final int REQ_SAVE = 2;

              private static final String HOOK_JS =
                  "(function(){if(window.__ddHook)return;window.__ddHook=1;"
                  + "var o=HTMLAnchorElement.prototype.click;"
                  + "HTMLAnchorElement.prototype.click=function(){var a=this;"
                  + "if(a.download&&a.href&&a.href.indexOf('blob:')===0){"
                  + "fetch(a.href).then(function(r){return r.blob();}).then(function(b){"
                  + "var f=new FileReader();f.onloadend=function(){var s=String(f.result);"
                  + "AndroidBridge.saveFile(a.download,b.type||'application/octet-stream',s.substring(s.indexOf(',')+1));};"
                  + "f.readAsDataURL(b);});return;}"
                  + "return o.apply(this,arguments);};})();";

              private WebView web;
              private ValueCallback<Uri[]> chooserCallback;
              private byte[] pendingBytes;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(Color.BLACK);
                  web = new WebView(this);
                  web.setBackgroundColor(Color.BLACK);
                  root.addView(web, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  setContentView(root);

                  root.setOnApplyWindowInsetsListener((v, insets) -> {
                      v.setPadding(insets.getSystemWindowInsetLeft(), insets.getSystemWindowInsetTop(),
                              insets.getSystemWindowInsetRight(), insets.getSystemWindowInsetBottom());
                      return insets;
                  });

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(false);

                  final WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                          .setDomain(HOST)
                          .addPathHandler("/", new AppPathHandler())
                          .build();

                  web.addJavascriptInterface(new Bridge(), "AndroidBridge");

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          return loader.shouldInterceptRequest(request.getUrl());
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          return !HOST.equals(request.getUrl().getHost());
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          view.evaluateJavascript(HOOK_JS, null);
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback,
                                                       FileChooserParams params) {
                          if (chooserCallback != null) chooserCallback.onReceiveValue(null);
                          chooserCallback = callback;
                          Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                          i.addCategory(Intent.CATEGORY_OPENABLE);
                          i.setType("*/*");
                          try {
                              startActivityForResult(Intent.createChooser(i, "Select backup file"), REQ_FILE);
                          } catch (Exception e) {
                              chooserCallback = null;
                              callback.onReceiveValue(null);
                              return false;
                          }
                          return true;
                      }

                      @Override
                      public boolean onJsConfirm(WebView view, String url, String message, final JsResult result) {
                          new AlertDialog.Builder(MainActivity.this)
                                  .setMessage(message)
                                  .setPositiveButton(android.R.string.ok, (d, w) -> result.confirm())
                                  .setNegativeButton(android.R.string.cancel, (d, w) -> result.cancel())
                                  .setOnCancelListener(d -> result.cancel())
                                  .show();
                          return true;
                      }

                      @Override
                      public boolean onJsAlert(WebView view, String url, String message, final JsResult result) {
                          new AlertDialog.Builder(MainActivity.this)
                                  .setMessage(message)
                                  .setPositiveButton(android.R.string.ok, (d, w) -> result.confirm())
                                  .setOnCancelListener(d -> result.confirm())
                                  .show();
                          return true;
                      }
                  });

                  web.loadUrl(START_URL);
              }

              private class Bridge {
                  @JavascriptInterface
                  public void saveFile(final String name, final String mime, String base64) {
                      pendingBytes = Base64.decode(base64, Base64.DEFAULT);
                      runOnUiThread(() -> {
                          Intent i = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                          i.addCategory(Intent.CATEGORY_OPENABLE);
                          i.setType(mime);
                          i.putExtra(Intent.EXTRA_TITLE, name);
                          try {
                              startActivityForResult(i, REQ_SAVE);
                          } catch (Exception e) {
                              Toast.makeText(MainActivity.this, "Could not open file picker", Toast.LENGTH_LONG).show();
                          }
                      });
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == REQ_FILE) {
                      if (chooserCallback != null) {
                          Uri[] r = null;
                          if (resultCode == RESULT_OK && data != null && data.getData() != null) {
                              r = new Uri[]{data.getData()};
                          }
                          chooserCallback.onReceiveValue(r);
                          chooserCallback = null;
                      }
                  } else if (requestCode == REQ_SAVE) {
                      if (resultCode == RESULT_OK && data != null && data.getData() != null && pendingBytes != null) {
                          try (OutputStream out = getContentResolver().openOutputStream(data.getData())) {
                              out.write(pendingBytes);
                              out.flush();
                              Toast.makeText(this, "File saved", Toast.LENGTH_SHORT).show();
                          } catch (Exception e) {
                              Toast.makeText(this, "Could not save file", Toast.LENGTH_LONG).show();
                          }
                      }
                      pendingBytes = null;
                  }
              }

              @Override
              public void onBackPressed() {
                  if (web != null && web.canGoBack()) {
                      web.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              private InputStream openAsset(String path) {
                  try {
                      return getAssets().open("www/" + path);
                  } catch (IOException e) {
                      return null;
                  }
              }

              private static String mimeFor(String path) {
                  int dot = path.lastIndexOf('.');
                  String ext = dot >= 0 ? path.substring(dot + 1).toLowerCase(Locale.ROOT) : "";
                  switch (ext) {
                      case "html": return "text/html";
                      case "js":
                      case "mjs": return "text/javascript";
                      case "css": return "text/css";
                      case "json": return "application/json";
                      case "webmanifest": return "application/manifest+json";
                      case "svg": return "image/svg+xml";
                      case "ico": return "image/x-icon";
                      case "woff2": return "font/woff2";
                      case "woff": return "font/woff";
                      case "txt": return "text/plain";
                      default:
                          String m = MimeTypeMap.getSingleton().getMimeTypeFromExtension(ext);
                          return m != null ? m : "application/octet-stream";
                  }
              }

              private class AppPathHandler implements WebViewAssetLoader.PathHandler {
                  @Override
                  public WebResourceResponse handle(String path) {
                      String p = path;
                      if (p.isEmpty() || p.endsWith("/")) p = p + "index.html";
                      InputStream in = openAsset(p);
                      if (in == null) {
                          String last = p.substring(p.lastIndexOf('/') + 1);
                          if (last.indexOf('.') < 0) {
                              p = "index.html";
                              in = openAsset(p);
                          }
                      }
                      if (in == null) {
                          return new WebResourceResponse("text/plain", "utf-8", 404, "Not Found", null,
                                  new ByteArrayInputStream(new byte[0]));
                      }
                      String mime = mimeFor(p);
                      boolean text = mime.startsWith("text/") || mime.contains("json") || mime.contains("javascript")
                              || mime.contains("xml");
                      return new WebResourceResponse(mime, text ? "utf-8" : null, in);
                  }
              }
          }
          EOF

      - name: Prepare signing keystore
        run: |
          set -e
          mkdir -p release-keystore
          if [ -f release-keystore/android.keystore ]; then
            echo "Using existing keystore from repo"
            echo "NEW_KS=false" >> "$GITHUB_ENV"
          else
            echo "No keystore in repo, creating a new one"
            keytool -genkeypair -v \
              -keystore release-keystore/android.keystore \
              -alias "$KS_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -dname "CN=Priyam Rai, O=Dark Days, C=IN"
            echo "NEW_KS=true" >> "$GITHUB_ENV"
          fi
          echo "KS_FILE=$GITHUB_WORKSPACE/release-keystore/android.keystore" >> "$GITHUB_ENV"

      - name: Install Android SDK pieces
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build signed APK and AAB
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          cd android
          gradle assembleRelease bundleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../DarkDays.apk
          cp app/build/outputs/bundle/release/app-release.aab ../DarkDays.aab

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DarkDays-APK
          path: DarkDays.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: DarkDays-AAB
          path: DarkDays.aab

      - name: Upload NEW keystore (back this up!)
        if: env.NEW_KS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-keystore-BACK-THIS-UP
          path: release-keystore/android.keystore

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Dark Days build ${{ github.run_number }}
          files: DarkDays.apk
